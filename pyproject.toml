[project]
name = "kbprojection"
version = "0.4.1"
description = "A python library for knowledge base prover injection."
authors = [{ name = "Gemini" }]
license = { text = "MIT" }
requires-python = ">=3.10,<4.0"
dependencies = [
    "requests>=2.31.0,<3",
    "pydantic>=2.9.0,<3",
    "openai>=1.50.0,<2",
    "anthropic>=0.34.0,<1",
    "google-genai>=0.3.0,<1",
    "nltk>=3.9,<4",
    "sentence-transformers>=3.1.0,<4",
    "torch>=2.0.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[dependency-groups]
test = ["pytest>=9,<10"]

[tool.setuptools.packages.find]
include = ["kbprojection*"]
